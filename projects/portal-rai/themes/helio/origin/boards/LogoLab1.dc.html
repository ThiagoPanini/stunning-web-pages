<x-dc>

<div role="img" aria-label="Logo em caracteres, versão Ondas: um agente conversacional no centro e um anel de guardrails ao redor. Ataques chegam de fora como frentes de onda vermelhas e quebram no anel; as respostas do agente saem como ondas: as válidas, em cinza, atravessam o anel, e as inválidas, em vermelho, são barradas por dentro." style="position: relative; width: 100%; aspect-ratio: 1 / 1; container-type: inline-size; overflow: hidden; background: {{fundo}}; color: #EEF1F2; font-family: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace">
<div aria-hidden="true" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2.604cqw; line-height: 1.2; white-space: pre; color: #C9D1D6">{{w}}</div>
<div aria-hidden="true" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2.604cqw; line-height: 1.2; white-space: pre; color: #5A90F8">{{b}}</div>
<div aria-hidden="true" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2.604cqw; line-height: 1.2; white-space: pre; color: #EC5B48">{{r}}</div>
<div aria-hidden="true" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); font-size: 2.604cqw; line-height: 1.2; white-space: pre; color: #87949C">{{g}}</div>
</div>

<script type="text/x-dc" data-dc-script data-props='{"fundo":{"editor":"color","default":"#0A0D0F"},"animado":{"editor":"boolean","default":true,"section":"Movimento"},"quadro":{"editor":"int","default":0,"min":0,"max":99999,"section":"Movimento"},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  state = { n: 0 };

  // Relogio: o quadro sai do tempo (85 ms por quadro), nunca de um contador nem de sorteio.
  // quadro > 0 escolhe o quadro de partida; 0 usa o quadro parado padrao desta versao.
  clock() {
    var p = this.props || {}, key = String(p.quadro) + '|' + String(p.animado);
    var t = typeof performance !== 'undefined' ? performance.now() : 0;
    if (key !== this._key) { this._key = key; this._t0 = t; }
    if (this._mq === undefined) { try { this._mq = window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { this._mq = null; } }
    var q = typeof p.quadro === 'number' ? p.quadro : parseFloat(p.quadro);
    var base = isFinite(q) && q > 0 ? q : 12845;   // quadro parado padrao: conta a historia inteira
    var run = !(p.animado === false || p.animado === 'false') && !(this._mq && this._mq.matches);
    return { f: base + (run ? (t - this._t0) / 85 : 0), run: run };
  }

  componentDidMount() {
    var self = this;
    var tick = function () {
      self._raf = requestAnimationFrame(tick);
      var c = self.clock();
      if (!c.run) return;
      var fi = Math.floor(c.f);
      if (fi !== self._fi) { self._fi = fi; self.setState({ n: fi }); }
    };
    this._raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }

  // Geometria da grade, calculada uma vez: 64 x 32 celulas, a mesma do logo atual.
  grid() {
    if (this._g) return this._g;
    var COLS = 64, ROWS = 32, n = COLS * ROWS;
    var D = new Float32Array(n), TH = new Float32Array(n), T = new Float32Array(n), DX = new Float32Array(n), DY = new Float32Array(n);
    for (var r = 0; r < ROWS; r++) for (var c = 0; c < COLS; c++) {
      var i = r * COLS + c, dx = (c + 0.5 - COLS / 2) / 2, dy = r + 0.5 - ROWS / 2, d = Math.sqrt(dx * dx + dy * dy);
      DX[i] = dx; DY[i] = dy; D[i] = d; TH[i] = Math.atan2(dy, dx);
      T[i] = 0.5 * (Math.abs(dx / d) * 0.5 + Math.abs(dy / d));   // meia espessura de uma celula na direcao do raio
    }
    this._g = { COLS: COLS, ROWS: ROWS, n: n, D: D, TH: TH, T: T, DX: DX, DY: DY };
    return this._g;
  }

  // Desenha um quadro. Camadas: w = agente, b = guardrails, r = o que precisa ser barrado, g = o que pode passar.
  // Ninguem viaja como tirinha: tudo e frente de onda (arco perpendicular ao caminho), com dois ecos atras.
  frame(f, meta) {
    var G = this.grid(), COLS = G.COLS, ROWS = G.ROWS, N = G.n, TAU = Math.PI * 2;
    var RS = 8.4, RP = 12.6, RO = 21.5, RC = RP + 1.15, R0 = RS + 0.9, RB = RP - 1.15, REND = 21.5;
    var WA = 0.3, WV = 0.26;
    var adist = function (p, q) { return Math.abs(((p - q + Math.PI * 3) % TAU) - Math.PI); };

    // Faixas: a = ataque, v = resposta valida, x = resposta invalida. Periodos primos entre si.
    // Para cada tipo, em que fracao da vida a onda ocupa o lado de fora (o), o lado de dentro (i) e o anel (n).
    var Z = { a: { o: [0, 1], n: [0.66, 0.96], w: WA }, v: { i: [0, 0.4], o: [0.27, 1], n: [0.17, 0.51], w: WV }, x: { i: [0, 1], n: [0.56, 1], w: WV } };
    var L = this._lanes || (this._lanes = [
      { t: 'v', per: 89, ph: 12, life: 0.94 }, { t: 'v', per: 103, ph: 71, life: 0.94 },
      { t: 'x', per: 113, ph: 64, life: 0.4 },
      { t: 'a', per: 61, ph: 7, life: 0.92 }, { t: 'a', per: 71, ph: 29, life: 0.92 }, { t: 'a', per: 83, ph: 50, life: 0.92 }
    ]);
    if (!this._memo || this._memoN > 800) { this._memo = {}; this._memoN = 0; }
    var memo = this._memo, self = this;
    var toca = function (S1, A0, S2, B0) {
      var z1 = Z[S1.t], z2 = Z[S2.t], l1 = S1.per * S1.life, l2 = S2.per * S2.life, ks = ['o', 'i', 'n'];
      for (var z = 0; z < 3; z++) {
        var u1 = z1[ks[z]], u2 = z2[ks[z]];
        if (u1 && u2 && A0 + u1[0] * l1 < B0 + u2[1] * l2 && B0 + u2[0] * l2 < A0 + u1[1] * l1) return true;
      }
      return false;
    };
    // Angulo de cada onda em cada ciclo: o primeiro candidato de uma sequencia fixa com folga inteira em relacao
    // as ondas de faixas anteriores que dividam com ela, ao mesmo tempo, o lado de fora, o lado de dentro ou o anel.
    // Sem folga, o ciclo e pulado.
    var ang = function ang(j, k) {
      var key = j + '|' + k;
      if (key in memo) return memo[key];
      var S = L[j], F0 = k * S.per - S.ph, F1 = F0 + S.per * S.life, proib = [], i, u;
      for (i = 0; i < j; i++) {
        var S2 = L[i], k1 = Math.floor((F0 + S2.ph) / S2.per), k2 = Math.floor((F1 + S2.ph) / S2.per);
        for (u = k1; u <= k2; u++) {
          var G0 = u * S2.per - S2.ph;
          if (!toca(S, F0, S2, G0)) continue;
          var t2 = ang(i, u);
          if (t2 !== null) proib.push([t2, Z[S.t].w + Z[S2.t].w + 0.1]);
        }
      }
      var best = null, folga = -1;
      for (var m = 0; m < 48; m++) {
        var th = ((((j * 0.618 + k * 0.381 + 0.25 + m * 0.2764) % 1) + 1) % 1) * TAU, cl = 9;
        for (u = 0; u < proib.length && cl > folga; u++) cl = Math.min(cl, adist(th, proib[u][0]) / proib[u][1]);
        if (cl > folga) { folga = cl; best = th; }
        if (folga >= 1.15) break;
      }
      var out = folga >= 1 ? best : null;
      memo[key] = out; self._memoN++;
      return out;
    };

    var ev = [], j, i, e;
    for (j = 0; j < L.length; j++) {
      var S = L[j], kk = Math.floor((f + S.ph) / S.per), q = ((f + S.ph) % S.per) / S.per;
      if (q > S.life) continue;
      var th0 = ang(j, kk);
      if (th0 === null) continue;
      e = { t: S.t, p: q / S.life, th: th0, j: j, k: kk };
      if (S.t === 'a') {
        // chega de fora (p < 0,66), quebra no anel e se desfaz
        e.hit = e.p >= 0.66;
        e.r = e.hit ? RC : RO - (RO - RC) * (e.p / 0.66);
        e.w = WA;
        e.blk = e.hit ? (e.p < 0.8 ? Math.min(WA * 0.6, 0.05 + (e.p - 0.66) * 1.6) : Math.max(0, WA * 0.6 * (1 - (e.p - 0.8) / 0.06))) : 0;
        e.run = e.p >= 0.8 ? WA * 0.6 + (e.p - 0.8) * 2.6 : 0;
      } else if (S.t === 'v') {
        e.r = R0 + (REND - R0) * e.p;
        e.w = WV;
        e.thin = e.r >= RP - 1.2 && e.r <= RP + 2.9;
      } else {
        e.hit = e.p >= 0.56;
        e.r = e.hit ? RB : R0 + (RB - R0) * (e.p / 0.56);
        e.w = WV;
        e.blk = e.hit ? (e.p < 0.8 ? Math.min(WV * 0.6, 0.05 + (e.p - 0.56) * 1.4) : Math.max(0, WV * 0.6 * (1 - (e.p - 0.8) / 0.08))) : 0;
        e.run = e.p >= 0.8 ? WV * 0.6 + (e.p - 0.8) * 1.6 : 0;
      }
      ev.push(e);
    }

    var W = new Array(N).fill(' '), B = new Array(N).fill(' '), R = new Array(N).fill(' '), Gy = new Array(N).fill(' ');
    var rot = f * 0.045, ct = Math.cos(-0.5), sn = Math.sin(-0.5), ramp = '.,:;;==+*';
    for (i = 0; i < N; i++) {
      var d = G.D[i];
      if (d <= RS) {
        var nx = G.DX[i] / RS, ny = G.DY[i] / RS, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
        var x1 = nx * ct - ny * sn, y1 = nx * sn + ny * ct;
        var lon = Math.atan2(x1, nz) + rot, lat = Math.asin(Math.max(-1, Math.min(1, y1)));
        var v = Math.sin(lon * 3 + lat * 2.4);
        if (v > -0.15) {
          var light = nx * -0.45 + ny * -0.55 + nz * 0.7;
          var lum = Math.max(0, Math.min(0.999, 0.18 + 0.82 * light + 0.12 * v));
          W[i] = ramp.charAt(Math.floor(lum * ramp.length));
        }
      } else if (Math.abs(d - RP) < G.T[i]) {
        var th = G.TH[i], ch = '';
        for (j = 0; j < ev.length && !ch; j++) if (ev[j].t === 'v' && ev[j].thin && adist(th, ev[j].th) < ev[j].w + 0.02) ch = '·';
        for (j = 0; j < ev.length && !ch; j++) {
          var da2 = adist(th, ev[j].th);
          if (ev[j].blk > 0 && da2 < ev[j].blk) ch = '#';
          else if (ev[j].run > 0 && Math.abs(da2 - ev[j].run) < 0.05) ch = '=';   // depois do impacto, duas varreduras curtas correm pelo anel, uma para cada lado
        }
        if (!ch) { var sweep = ((th - f * 0.035) % TAU + TAU) % TAU; ch = sweep < 0.9 ? '=' : ':'; }
        B[i] = ch;
      }
    }

    // Frentes primeiro, ecos depois: uma celula so recebe um caractere, em uma camada.
    var arc = function (M, e2, rad, half, core, edge) {
      if (rad <= RS + 0.55) return;
      for (var c2 = 0; c2 < N; c2++) {
        if (Math.abs(G.D[c2] - rad) >= G.T[c2] || G.D[c2] <= RS) continue;
        var da = adist(G.TH[c2], e2.th);
        if (da >= half) continue;
        if (B[c2] !== ' ' || R[c2] !== ' ' || Gy[c2] !== ' ') continue;
        M[c2] = da < e2.w * 0.42 ? core : edge;
      }
    };
    for (j = 0; j < ev.length; j++) {
      e = ev[j];
      if (e.t === 'a') {
        if (!e.hit) arc(R, e, e.r, e.w, '×', '·');
        else if (e.p < 0.82) arc(R, e, e.r, e.w * 0.46 * (1 - (e.p - 0.66) * 4), '+', '+');
      } else if (e.t === 'v') {
        if (e.r <= 20.5) arc(Gy, e, e.r, e.w, e.r <= 17 ? 'o' : '·', '·');
      } else {
        if (!e.hit) arc(R, e, e.r, e.w, 'ø', '·');
        else if (e.p < 0.78) arc(R, e, e.r, e.w * 0.46 * (1 - (e.p - 0.56) * 3), '+', '+');
      }
    }
    for (j = 0; j < ev.length; j++) {
      e = ev[j];
      if (e.t === 'a' && !e.hit) { arc(R, e, e.r + 1.55, e.w, '·', '·'); arc(R, e, e.r + 3.1, e.w, '·', '·'); }
      else if (e.t === 'v' && e.r <= 19) { arc(Gy, e, e.r - 1.55, e.w, '·', '·'); arc(Gy, e, e.r - 3.1, e.w, '·', '·'); }
      else if (e.t === 'x' && !e.hit) { arc(R, e, e.r - 1.55, e.w, '·', '·'); }
    }

    var join = function (m) { var s = []; for (var r2 = 0; r2 < ROWS; r2++) s.push(m.slice(r2 * COLS, r2 * COLS + COLS).join('')); return s.join('\n'); };
    var out = { w: join(W), b: join(B), r: join(R), g: join(Gy) };
    if (meta) out.meta = { ev: ev };
    return out;
  }

  renderVals() {
    var c = this.clock(), o = this.frame(Math.floor(c.f));
    return { w: o.w, b: o.b, r: o.r, g: o.g, fundo: (this.props && this.props.fundo) || '#0A0D0F' };
  }
}
</script>

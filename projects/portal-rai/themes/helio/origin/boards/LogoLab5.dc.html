<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Responsible AI · Logo · laboratório 5 · Eclusa</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div role="img" aria-label="Logo geométrico, versão Eclusa: um disco no centro é o agente conversacional e um anel de segmentos azuis é o perímetro de guardrails. Ataques, cruzes vermelhas, chegam de fora; os segmentos se armam, recebem o impacto e a cruz se desfaz em dois traços. As respostas válidas, círculos cinza, saem por uma porta que os segmentos abrem; as inválidas, círculos vermelhos cortados, são barradas por dentro." style="position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: {{fundo}}">
<svg aria-hidden="true" viewBox="0 0 100 100" width="100%" height="100%" style="position: absolute; left: 0; top: 0; display: block">
<sc-for list="{{rings}}" as="m" hint-placeholder-count="2">
<g style="transform: translate({{m.x}}px, {{m.y}}px); opacity: {{m.op}}"><circle cx="0" cy="0" r="1.95" fill="none" stroke="#87949C" stroke-width="1.25"></circle></g>
</sc-for>
<sc-for list="{{slashed}}" as="m" hint-placeholder-count="1">
<g style="transform: translate({{m.x}}px, {{m.y}}px); opacity: {{m.op}}"><circle cx="0" cy="0" r="1.95" fill="none" stroke="#EC5B48" stroke-width="1.25"></circle><line x1="-2.45" y1="2.45" x2="2.45" y2="-2.45" stroke="#EC5B48" stroke-width="1.25" stroke-linecap="round"></line></g>
</sc-for>
<sc-for list="{{dashesIn}}" as="m" hint-placeholder-count="1">
<g style="transform: translate({{m.x}}px, {{m.y}}px) rotate({{m.rot}}deg); opacity: {{m.op}}"><line x1="-3" y1="0" x2="3" y2="0" stroke="#EC5B48" stroke-width="1.25" stroke-linecap="round" style="stroke-dasharray: {{m.da}}; stroke-dashoffset: {{m.off}}"></line></g>
</sc-for>
<g transform="translate(50 50)">
<circle cx="0" cy="0" r="10.8" fill="#C9D1D6" style="transform: scale({{discK}})"></circle>
<sc-for list="{{segs}}" as="s" hint-placeholder-count="24">
<circle cx="0" cy="0" r="30" fill="none" style="transform: rotate({{s.rot}}deg) scale({{s.k}}); stroke: {{s.col}}; stroke-width: {{s.w}}; stroke-dasharray: {{s.dash}}; opacity: {{s.op}}"></circle>
</sc-for>
<sc-for list="{{waves}}" as="s" hint-placeholder-count="1">
<circle cx="0" cy="0" r="30" fill="none" stroke="#A9C5FB" style="transform: rotate({{s.rot}}deg) scale({{s.k}}); stroke-width: {{s.w}}; stroke-dasharray: {{s.dash}}; opacity: {{s.op}}"></circle>
</sc-for>
</g>
<sc-for list="{{dashesOut}}" as="m" hint-placeholder-count="1">
<g style="transform: translate({{m.x}}px, {{m.y}}px) rotate({{m.rot}}deg); opacity: {{m.op}}"><line x1="-3" y1="0" x2="3" y2="0" stroke="#EC5B48" stroke-width="1.25" stroke-linecap="round" style="stroke-dasharray: {{m.da}}; stroke-dashoffset: {{m.off}}"></line></g>
</sc-for>
<sc-for list="{{crosses}}" as="m" hint-placeholder-count="2">
<g style="transform: translate({{m.x}}px, {{m.y}}px); opacity: {{m.op}}"><line x1="-2.2" y1="-2.2" x2="2.2" y2="2.2" stroke="#EC5B48" stroke-width="1.25" stroke-linecap="round"></line><line x1="2.2" y1="-2.2" x2="-2.2" y2="2.2" stroke="#EC5B48" stroke-width="1.25" stroke-linecap="round"></line></g>
</sc-for>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"fundo":{"editor":"color","default":"#0A0D0F"},"animado":{"editor":"boolean","default":true,"section":"Movimento"},"quadro":{"editor":"int","default":0,"min":0,"max":99999,"section":"Movimento"},"$preview":{"width":560,"height":560}}'>
class Component extends DCLogic {
  state = { n: 0 };

  // Relogio: o quadro sai do tempo (85 ms por quadro), nunca de um contador nem de sorteio.
  // quadro > 0 escolhe o quadro de partida; 0 usa o quadro parado padrao desta versao.
  clock() {
    var p = this.props || {}, key = String(p.quadro) + '|' + String(p.animado);
    var t = typeof performance !== 'undefined' ? performance.now() : 0;
    if (key !== this._key) { this._key = key; this._t0 = t; }
    if (this._mq === undefined) { try { this._mq = window.matchMedia('(prefers-reduced-motion: reduce)'); } catch (e) { this._mq = null; } }
    var q = typeof p.quadro === 'number' ? p.quadro : parseFloat(p.quadro);
    var base = isFinite(q) && q > 0 ? q : 55435;   // quadro parado padrao: conta a historia inteira
    var run = !(p.animado === false || p.animado === 'false') && !(this._mq && this._mq.matches);
    return { f: base + (run ? (t - this._t0) / 85 : 0), run: run };
  }

  componentDidMount() {
    var self = this;
    var tick = function () {
      self._raf = requestAnimationFrame(tick);
      if (self.clock().run) self.setState({ n: (self.state.n || 0) + 1 });
    };
    this._raf = requestAnimationFrame(tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this._raf);
  }

  // Monta a cena de um quadro (f pode ser fracionario), em unidades de 0 a 100.
  // O anel e uma eclusa: 24 segmentos que se armam contra o que chega, abrem uma porta para o que pode sair
  // e seguram por dentro o que nao pode.
  scene(f, meta) {
    var NS = 24, STEP = 360 / NS, RR = 30, WS = 3.4, RD = 10.8, rad = Math.PI / 180;
    var TA = 24, TV = 21, TX = 15;                      // quadros ate o contato: ataque, resposta valida (na porta), resposta invalida
    var mod = function (a, n) { return ((a % n) + n) % n; };
    var dang = function (p, q) { return mod(p - q + 180, 360) - 180; };   // diferenca de angulos, com sinal, em graus
    var rot = function (g) { return g * 0.25; };        // o anel gira devagar: 0,25 grau por quadro
    var sm = function (x) { return x <= 0 ? 0 : (x >= 1 ? 1 : x * x * (3 - 2 * x)); };

    // Faixas: v = resposta valida, x = resposta invalida, a = ataque.
    var L = this._lanes || (this._lanes = [
      { t: 'v', per: 67, ph: 12, life: 64 }, { t: 'v', per: 79, ph: 55, life: 64 }, { t: 'v', per: 97, ph: 71, life: 64 },
      { t: 'x', per: 113, ph: 64, life: 32 },
      { t: 'a', per: 43, ph: 7, life: 44 }, { t: 'a', per: 53, ph: 29, life: 44 }, { t: 'a', per: 61, ph: 50, life: 44 }, { t: 'a', per: 71, ph: 20, life: 44 }
    ]);
    if (!this._memo || this._memoN > 900) { this._memo = {}; this._memoN = 0; }
    var memo = this._memo, self = this;
    // Angulo de cada evento em cada ciclo: o primeiro de uma sequencia fixa a 38 graus ou mais de todo evento de faixa
    // anterior em cena ao mesmo tempo. Resposta valida mira a fresta entre dois segmentos (a porta); ataque e resposta
    // invalida miram o meio de um segmento. Sem angulo livre, o ciclo e pulado.
    var plan = function plan(j, k) {
      var key = j + '|' + k;
      if (key in memo) return memo[key];
      var S = L[j], F0 = k * S.per - S.ph, kf = F0 + (S.t === 'a' ? TA : (S.t === 'v' ? TV : TX)), proib = [], i, u, m, out = null;
      for (i = 0; i < j; i++) {
        var S2 = L[i], k1 = Math.floor((F0 + S2.ph) / S2.per) - 1, k2 = Math.floor((F0 + S.life + S2.ph) / S2.per);
        for (u = k1; u <= k2; u++) { var o2 = plan(i, u); if (o2 && o2.F0 < F0 + S.life && F0 < o2.F0 + S2.life) proib.push(o2.th); }
      }
      for (m = 0; m < NS && !out; m++) {
        var th = mod((mod(j * 7 + k * 5 + m * 11, NS) + (S.t === 'v' ? 0.5 : 0)) * STEP + rot(kf), 360), ok = true;
        for (u = 0; u < proib.length; u++) if (Math.abs(dang(th, proib[u])) < 38) ok = false;
        if (ok) out = { t: S.t, F0: F0, th: th, kf: kf };
      }
      memo[key] = out; self._memoN++;
      return out;
    };
    var ev = [], j, q, e, t;
    for (j = 0; j < L.length; j++) {
      var kk = Math.floor((f + L[j].ph) / L[j].per);
      for (q = kk - 1; q <= kk; q++) { e = plan(j, q); if (e && f >= e.F0 && f < e.F0 + L[j].life) ev.push(e); }
    }

    var at = function (r, a, op) { return { x: (50 + r * Math.cos(a * rad)).toFixed(2), y: (50 + r * Math.sin(a * rad)).toFixed(2), op: Math.max(0, Math.min(1, op)).toFixed(3) }; };
    // traco tangente ao anel, com metade do comprimento "half": um tracejado de um so traco sobre uma linha de -3 a 3
    // (a ponta redonda soma meia espessura de cada lado)
    var dash = function (list, r, a, half, op) {
      if (op <= 0.02 || half <= 0.05) return;
      var m = at(r, a, op), L = Math.max(0.01, 2 * half - 1.25);
      m.rot = (a + 90).toFixed(2); m.da = L.toFixed(2) + ' 100'; m.off = (L / 2 - 3).toFixed(2);
      list.push(m);
    };
    // arco fino, centrado no angulo a: circulo de raio 30 escalado ate o raio r, com um so traco de tracejado
    var arc = function (list, r, a, half, w, op) {
      if (op <= 0.02) return;
      var k = r / 30;
      list.push({ k: k.toFixed(4), w: (w / k).toFixed(3), dash: (30 * 2 * half * rad).toFixed(2) + ' 400', rot: (a - half).toFixed(2), op: Math.min(1, op).toFixed(3) });
    };
    var rings = [], slashed = [], crosses = [], dashesIn = [], dashesOut = [], waves = [], acts = [], disc = RD;

    for (j = 0; j < ev.length; j++) {
      e = ev[j]; t = f - e.F0;
      if (e.t === 'a') {
        // ataque: cruz que vem de fora em linha reta; no contato se parte em dois tracos que escorrem pelo anel
        var tc = t - TA, rc = RR + WS / 2 + 3.3;
        if (tc < 0) crosses.push(at(rc + 1.5 * (-tc), e.th, t / 4));
        else if (tc < 16) {
          var sl = 17 * (1 - Math.exp(-tc / 5)), fade = 1 - (tc / 16) * (tc / 16);
          dash(dashesOut, rc - 0.9 + tc * 0.07, e.th + sl, 2.5 * (1 - tc / 20), fade);
          dash(dashesOut, rc - 0.9 + tc * 0.07, e.th - sl, 2.5 * (1 - tc / 20), fade);
          arc(waves, rc + 0.6 + tc * 0.62, e.th, 15 - tc * 0.35, 0.55, 0.8 * (1 - tc / 16));
        }
        acts.push({ k: 'a', th: e.th, tc: tc });
      } else if (e.t === 'v') {
        // resposta valida: sai de tras do disco, passa pela porta e segue
        var rv = 8 + 1.05 * t;
        rings.push(at(rv, e.th, (75 - rv) / 8));
        acts.push({ k: 'v', th: e.th, tc: t - TV });
        if (t < 10) disc = Math.max(disc, RD + 0.6 * Math.exp(-t / 3.5));
      } else {
        var tx = t - TX, rin = RR - WS / 2 - 3.1;
        if (tx < 0) slashed.push(at(8 + (rin - 8) * (t / TX), e.th, 1));
        else if (tx < 16) {
          var sl2 = 15 * (1 - Math.exp(-tx / 5)), fade2 = 1 - (tx / 16) * (tx / 16);
          dash(dashesIn, rin + 0.9 - tx * 0.05, e.th + sl2, 2.5 * (1 - tx / 20), fade2);
          dash(dashesIn, rin + 0.9 - tx * 0.05, e.th - sl2, 2.5 * (1 - tx / 20), fade2);
          arc(waves, rin - 0.4 - tx * 0.4, e.th, 15 - tx * 0.35, 0.55, 0.8 * (1 - tx / 16));
        }
        acts.push({ k: 'x', th: e.th, tc: tx });
        if (t < 10) disc = Math.max(disc, RD + 0.6 * Math.exp(-t / 3.5));
      }
    }

    // Cada segmento soma o que os eventos pedem dele: recuo ou avanco no raio, desvio no angulo, espessura e clarao.
    var segs = [];
    for (j = 0; j < NS; j++) {
      var a0 = j * STEP + rot(f), dr = 0, da = 0, w = WS, hot = 0;
      for (q = 0; q < acts.length; q++) {
        var A = acts[q], dd = dang(a0, A.th), near = Math.exp(-(dd / 13) * (dd / 13)), sgn = A.k === 'x' ? -1 : 1;
        if (A.k === 'v') {
          // porta: os segmentos se afastam para os lados e afinam; depois fecham, com um nada de mola
          var op = sm((A.tc + 9) / 7) * (1 - sm((A.tc - 3) / 8));
          da += (dd >= 0 ? 1 : -1) * 8.4 * Math.exp(-Math.abs(dd) / 30) * op;
          w -= 0.9 * near * op;
        } else if (A.tc < 0) {
          // arma: avanca ao encontro do que vem e engrossa
          var br = sm((A.tc + 10) / 10);
          dr += sgn * 1.5 * near * br; w += 1.5 * near * br;
        } else {
          // impacto: mola amortecida, clarao que esfria
          dr += sgn * 1.5 * near * Math.exp(-A.tc / 4.2) * Math.cos(A.tc * 0.85);
          w += 1.5 * near * Math.exp(-A.tc / 6);
          hot = Math.max(hot, near * Math.exp(-A.tc / 5));
        }
      }
      var sweep = mod(a0 * rad - f * 0.035, Math.PI * 2) < 0.9, r = RR + dr, half = STEP / 2 - 1.5, ks = r / 30;
      segs.push({
        k: ks.toFixed(4), w: ((w + (sweep ? 0.5 : 0)) / ks).toFixed(3), dash: (30 * 2 * half * rad).toFixed(2) + ' 400', rot: (a0 + da - half).toFixed(2),
        col: hot > 0.55 ? '#DCE7FE' : (hot > 0.22 ? '#A9C5FB' : '#5A90F8'), op: sweep || hot > 0.1 ? 1 : 0.8
      });
    }
    var out = { segs: segs, waves: waves, rings: rings, slashed: slashed, crosses: crosses, dashesIn: dashesIn, dashesOut: dashesOut, discK: (disc / RD).toFixed(4) };
    if (meta) out.meta = { ev: ev };
    return out;
  }

  renderVals() {
    var c = this.clock(), o = this.scene(c.f);
    o.fundo = (this.props && this.props.fundo) || '#0A0D0F';
    return o;
  }
}
</script>
</body>
</html>
